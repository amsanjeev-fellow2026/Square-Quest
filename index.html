</style></head><body><div id="app"></div><div id="ov"></div><script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a},sq=n=>n*n,isSq=x=>Number.isInteger(Math.sqrt(x));
const MAX={4:10,5:15,6:30},S={g:5,mode:'solo',qn:10,hints:true,calm:false,snd:true,maxB:0},ST={att:0,ok:0,tags:{},stars:{},pm:{}};

function opts(a,c){const s=new Set([a]);for(const x of c){if(x>0&&s.size<4)s.add(x)}while(s.size<4){const x=a+R(-8,8);if(x>0)s.add(x)}return sh([...s])}

const G={
build(){const n=[R(2,5),R(3,7),R(4,8)][S.g-4];return{z:'build',n,p:`Build a square with ${n*n} tiles`,ans:`${n} rows × ${n} columns`,pts:150,hint:`A square has equal rows and columns. Try ${n} rows of ${n}.`,ex:`${n} rows × ${n} columns = ${n*n} tiles, so ${n}² = ${n*n}.`}},
market(){const n=R(3,Math.min(mb(),10)),a=`${n} × ${n}`;return{z:'market',vis:n,p:`This square has ${n*n} counters. Which equation matches?`,ch:sh([a,`${n} × 2`,`${n} + ${n}`,`${n} × ${n+1}`]),ans:a,tag:{[`${n} × 2`]:'doubling',[`${n} + ${n}`]:'doubling'},hint:`Count the rows and the columns. They are equal.`,ex:`${a} = ${n*n}, so ${n}² = ${n*n}.`}},
station(){const n=R(2,mb()),a=n*n;return{z:'station',p:`${n}² = ?`,ch:opts(a,[2*n,...sh([n*(n+1),a+n,a-n,3*n])]),ans:a,tag:{[2*n]:'doubling'},hint:`Squaring means ${n} × ${n}, not ${n} × 2.`,ex:`${n}² = ${n} × ${n} = ${a}`}},
museum(){const n=R(2,mb()),a=n*n,t=R(0,3),P=[[`□² = ${a}`,n],[`${n}² = □`,a],[`□ × □ = ${a}`,n],[`${n} × ${n} = □`,a]][t];return{z:'museum',p:P[0],ch:opts(P[1],D(n,P[1])),ans:P[1],tag:P[1]===a?{[2*n]:'doubling'}:{},hint:P[1]===n?`Which number times itself makes ${a}?`:`Multiply ${n} by itself.`,ex:`${n} × ${n} = ${a}`}},
park(){const m=Math.min(mb(),12);if(R(0,2)===0){const ks=sh([...Array(m).keys()]).slice(0,3).map(x=>sq(x+1)).sort((a,b)=>a-b);let x;do{x=R(2,sq(m))}while(isSq(x));return{z:'park',p:'Which is NOT a square number?',ch:sh([...ks,x]),ans:x,hint:'Try to build each number as a square array.',ex:`${ks.join(', ')} are square numbers. ${x} is not.`}}
const k=R(1,Math.max(1,Math.min(mb(),15)-4)),s=[0,1,2,3,4].map(i=>sq(k+i)),b=R(3,4),a=s[b];return{z:'park',p:s.map((v,i)=>i===b?'__':v).join(', '),ch:opts(a,sh([a+1,a-1,a+k+b,a-k-b])),ans:a,hint:S.g===6?'The gaps are consecutive odd numbers: +3, +5, +7…':'Look at how the gaps grow.',ex:`${s.join(', ')} are square numbers.`}},

function gen(z,seen){for(let t=0;t<30;t++){const q=G[z]();q.k=z+q.p;if(!seen.has(q.k)){seen.add(q.k);return q}}return null}
function start(z){zone=z;if(ROS.cloud)applyCls();const seen=new Set(),ord=ZN.map(x=>x[0]),qs=[];for(let i=0;i<(ROS.list.length||S.qn);i++){const zz=z==='mix'?ord[i%6]:z,q=gen(zz,seen)||gen(zz,new Set());if(q)qs.push(q)}startQs(qs,ROS.list.length?ROS.list.map(s=>({...s})):0)}
function startQs(qs,who){if(who)who=who.slice(0,qs.length);const nm=who?ROS.tn:NM[S.mode],z=nm.map(()=>0);Rn={qs,who,abs:[],nm,i:0,sc:[...z],ok:[...z],att:[...z],turn:0,missed:[],total:qs.length};ov();resetQ();go('play')}
function resetQ(){Object.assign(Rn,{st:'ask',wr:0,hint:false,msg:'',kind:'',bad:new Set(),ready:0});if(Rn.who)Rn.turn=Rn.who[Rn.i].t;BGnew(Rn.qs[Rn.i].n||0)}
const BGnew=n=>BG={set:new Set(),n,m:null,lock:false},cur=()=>Rn.qs[Rn.i],go=v=>{V=v;render()};
function setG(g){S.g=g;S.maxB=0;render()}function setM(m){S.mode=m;render()}
function resolve(ok,tag,wm){if(Rn.st==='done')return;const q=cur(),p=Rn.turn,pm=ST.pm[q.z]=ST.pm[q.z]||{a:0,c:0};
if(ok){Rn.st='done';const f=Rn.wr?.5:Rn.hint?.7:1,pts=Math.round((q.pts||100)*f);Rn.sc[p]+=pts;if(Rn.who)Rn.who[Rn.i].pts=pts;if(!Rn.wr){Rn.ok[p]++;ST.ok++;pm.c++}Rn.att[p]++;ST.att++;pm.a++;Rn.kind='ok';Rn.msg=`${sh(['Brilliant!','Square master!','Great thinking!','Superb!'])[0]} +${pts} points<br><small>${q.ex}</small>`;snd(660)}

<div class="row">${[4,5,6].map(g=>`<button class="chip ${S.g===g&&!S.maxB?'sel':''}" onclick="setG(${g})">Grade ${g}</button>`).join('')}<button class="chip ${S.maxB?'sel':''}" onclick="teacher()">Custom ⚙</button></div>
<div class="row">${chips([['solo','👤 Solo'],['pair','👥 Pair'],['team','🏁 Team']],'setM',v=>S.mode===v)}</div>
<div class="row"><button class="b big" onclick="go('map')">▶ Play</button><button class="b" onclick="L=0;LE=3;BGnew(3);go('learn')">📘 Learn first</button><button class="b" onclick="how()">❓ How to play</button><button class="b" onclick="classSetup()">👩‍🏫 Class setup</button><button class="b" onclick="teacher()">⚙ Teacher</button></div>${ROS.list.length?`<div class="sub">Class${ROS.cloud&&CN?' '+esc(CN):''}: ${ROS.list.length} students in ${ROS.T} teams${ROS.cloud?' ('+ROS.tn.map(esc).join(', ')+')':''}. Every student gets a turn.</div>`:''}

<div class="sub">Zones completed: ${d} / 6 ${'⭐'.repeat(d)}</div></div>`}

<div><small>${Rn.abs&&Rn.abs.length?'Absent: '+Rn.abs.map(esc).join(', ')+' · ':''}Total ${tot} points · Accuracy ${Rn.pct}% · ${Rn.total} questions · Zones: ${zs.join(', ')} · Next: ${Rn.pct>=90?'try a harder level':Rn.pct>=50?'practise your mistakes':'play again with hints'}</small></div>
<div class="row"><button class="b big" onclick="start(zone)">↻ Play again</button>${Rn.missed.length?`<button class="b" onclick="startQs(Rn.missed.map(q=>({...q})),Rn.who?Rn.missed.map(q=>({...q.by,pts:0})):0)">🔁 Practise mistakes (${Rn.missed.length})</button>`:''}<button class="b" onclick="harder()">⬆ Harder level</button><button class="b" onclick="go('map')">🗺 Map</button><button class="b" onclick="go('home')">🏠 Home</button></div></div>`}
function readyV(){const s=Rn.who[Rn.i],c=TC[s.t%TC.length];return`<div class="bar"><button class="b" onclick="pause()">⏸ Pause</button><b>Round ${Rn.i+1} of ${Rn.total}</b></div><div class="hero"><div class="tn" style="border-color:${c}">${esc(Rn.nm[s.t])}</div><h1 class="nm" style="border-color:${c}">${esc(s.n)}</h1><div class="sub">Come to the board when you are ready!</div><div class="row"><button class="b big" onclick="Rn.ready=1;render()">✋ I am ready!</button><button class="b" onclick="absent()">🚫 Absent — call another</button></div></div>`}

function deal(n,T){ROS.list=sh(n).map((x,i)=>({n:x,t:i%T}));ROS.T=T;ROS.cloud=false;ROS.tn=['Team A','Team B','Team C','Team D'].slice(0,T)}

// class data: same Firebase project as the other classroom games, loads by itself
const FB={project:'maths-penalty-cup',key:'AIzaSyAMsz-GB8WmGNUYjod6fquQJMYBQPJeOGs'};let CLS={},CN='',CODE=ls('pk_code'),cm='';
try{CLS={...JSON.parse(ls('pk_lib')||'{}'),...JSON.parse(ls('nb_cls')||'{}')};CN=ls('nb_cn');if(!CLS[CN])CN=Object.keys(CLS)[0]||''}catch(e){}

async function loadCode(c){c=(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');CODE=c;if(c.length!=8){cm='A class code has 8 letters and numbers.';return false}

const j=await r.json();CLS=JSON.parse(j.fields.lib.stringValue);const ks=Object.keys(CLS);if(!CLS[CN])CN=ks[0]||'';ss('pk_code',c);ss('nb_cn',CN);ss('nb_cls',JSON.stringify(CLS));cm=ks.length?'Class loaded.':'That code has no classes yet.';return ks.length>0}

ov(`<h2>👩‍🏫 Class setup</h2><div class="row"><button class="chip ${m?'sel':''}" onclick="CS.tab='manual';classSetup()">✍ Manual</button><button class="chip ${m?'':'sel'}" onclick="CS.tab='auto';classSetup()">☁ Class code</button></div>${m?`<textarea id="nmtx" rows="6" placeholder="One student name per line">${esc(CS.txt)}</textarea><label>Number of teams <select id="tc">${o([2,3,4])}</select></label>`:`<label>Class code <input id="cc" maxlength="9" value="${esc(CODE)}" placeholder="8-letter code from your other games"></label>${ks.length>1?`<label>Class <select onchange="pickCls(this.value)">${ks.map(k=>`<option ${k===CN?'selected':''}>${esc(k)}</option>`).join('')}</select></label>`:''}<div>${T.map(t=>`<b>${esc(t.name)}</b> (${t.pl.length})`).join(' · ')}</div><small>The code is saved on this device and the class loads by itself next time. Teams come from your class groups.</small>`}<div id="cm" aria-live="polite">${m?'':esc(cm)}</div><div class="row"><button class="b big" onclick="loadCls()">${m?'Use these names':'Load class'}</button><button class="b" onclick="clearCls()">Clear class</button><button class="b" onclick="ov()">Close</button></div>`)}

$('#cm').textContent='Loading...';const ok=await loadCode($('#cc').value);if(ok&&applyCls()){ov();render()}else if($('#cm'))$('#cm').textContent=cm||'No students found in that class.'}

else if(L===1)b=`<div class="row">${[1,2,3,4,5].map(n=>`<button class="chip ${LE===n?'sel':''}" style="font-size:2em" onclick="LE=${n};render()">${n}</button>`).join('')}</div>${arr(LE)}<div class="q">${LE} × ${LE} = ${LE*LE}<br>${LE}² = ${LE*LE}</div>`;
